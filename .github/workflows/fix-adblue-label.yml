name: Fix AdBlue label

on:
  push:
    paths:
      - '.github/workflows/fix-adblue-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Apply AdBlue label fix
        run: python3 .github/scripts/fix_adblue_label.py

      - name: Validate Lua syntax
        run: luac -p scripts/AutoDriveFlurkarte.lua

      - name: Verify AdBlue label and version
        run: |
          grep -q 'if name == "DEF" then title = "AdBlue" end' scripts/AutoDriveFlurkarte.lua
          grep -q 'VERSION         = "4.3.1"' scripts/AutoDriveFlurkarte.lua
          grep -q '<version>4.3.1.0</version>' modDesc.xml

      - name: Validate diff
        run: git diff --check

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/AutoDriveFlurkarte.lua modDesc.xml
          git diff --cached --quiet || git commit -m "fix: label DEF as AdBlue"
          git push
