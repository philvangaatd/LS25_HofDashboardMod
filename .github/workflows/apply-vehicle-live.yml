name: Apply live vehicle export cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_vehicle_live.py'
      - '.github/workflows/apply-vehicle-live.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic vehicle export cleanup
        run: python3 .github/scripts/apply_vehicle_live.py

      - name: Validate expected Lua contract
        run: |
          grep -q 'VERSION         = "4.2.0"' scripts/AutoDriveFlurkarte.lua
          grep -q 'vehicleDiagnostics' scripts/AutoDriveFlurkarte.lua
          grep -q 'getDamageAmount' scripts/AutoDriveFlurkarte.lua
          grep -q 'getFillUnitSupportedFillTypes' scripts/AutoDriveFlurkarte.lua
          grep -q 'StoreItemUtil.getDefaultPrice' scripts/AutoDriveFlurkarte.lua
          grep -q 'shopPrice' scripts/AutoDriveFlurkarte.lua
          grep -q 'fillUnits' scripts/AutoDriveFlurkarte.lua
          grep -q '<version>4.2.0.0</version>' modDesc.xml

      - name: Install Lua parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Validate Lua syntax
        run: luac -p scripts/AutoDriveFlurkarte.lua

      - name: Verify diff
        run: git diff --check

      - name: Commit application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/AutoDriveFlurkarte.lua modDesc.xml
          if git diff --cached --quiet; then
            echo 'No application changes to commit'
          else
            git commit -m 'feat: export complete live vehicle data'
            git push
          fi
