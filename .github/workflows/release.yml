name: Build and release mod

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $content = Get-Content -Raw -LiteralPath "scripts/Version.lua"
          $match = [regex]::Match($content, 'MOD_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "MOD_VERSION not found." }
          $version = $match.Groups[1].Value
          $tag = "v$version"
          [xml]$modDesc = Get-Content -Raw -LiteralPath "modDesc.xml"
          $xmlVersion = [string]$modDesc.modDesc.version
          if ($xmlVersion -ne "$version.0") { throw "Version mismatch: Version.lua=$version, modDesc.xml=$xmlVersion" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            "publish=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; skipping publication."
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Build mod ZIP
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/build-release.ps1 -ArtifactDirectory dist

      - name: Verify package
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/FS25_HofDashboard.zip" -PathType Leaf)) {
            throw "FS25_HofDashboard.zip was not created."
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/FS25_HofDashboard.zip").Hash.ToLowerInvariant()
          Write-Host "SHA-256: $hash"

      - name: Publish GitHub release
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $notes = @"
          ## LS25 Hof-Dashboard Mod v$env:VERSION

          ### Near-Live-Daten
          - vollständiger Live-Export jetzt alle 2 Sekunden statt alle 15 Sekunden
          - Dashboard kann Änderungen dadurch praktisch unmittelbar darstellen
          - Exportintervall wird zusätzlich als updateIntervalMs im Live-Payload veröffentlicht
          - Protokollversion bleibt 1; bestehende Collector-Struktur bleibt kompatibel

          ### Enthaltene Live-Daten
          - Felder, Fahrzeuge, Tiere und Bienen
          - aktive Produktionen und Vorräte
          - Verträge und Marktpreise
          - kompatible GIANTS- und Mod-Lager

          ### Installation
          Das Windows-Dashboard kann diese Mod-Version automatisch installieren bzw. aktualisieren. Bei manueller Installation Landwirtschafts-Simulator 25 schließen und die vorhandene FS25_HofDashboard.zip im Mod-Ordner ersetzen. Die ZIP nicht entpacken.
          "@
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create $env:TAG "dist/FS25_HofDashboard.zip" --repo $env:GITHUB_REPOSITORY --title "LS25 Hof-Dashboard Mod v$env:VERSION" --notes-file release-notes.md
