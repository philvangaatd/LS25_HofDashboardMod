name: Upgrade live animals

on:
  push:
    paths:
      - '.github/workflows/upgrade-animals-live.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Apply live animal upgrade
        run: python3 .github/scripts/upgrade_animals_live.py

      - name: Validate Lua syntax
        run: luac -p scripts/AutoDriveFlurkarte.lua

      - name: Verify animal contract
        run: |
          grep -q 'VERSION         = "4.5.0"' scripts/AutoDriveFlurkarte.lua
          grep -q 'spec_husbandryAnimals' scripts/AutoDriveFlurkarte.lua
          grep -q 'animalDiagnostics' scripts/AutoDriveFlurkarte.lua
          grep -q 'collectBeehives' scripts/AutoDriveFlurkarte.lua
          grep -q 'spec_husbandryMilk' scripts/AutoDriveFlurkarte.lua
          grep -q 'spec_husbandryPallets' scripts/AutoDriveFlurkarte.lua
          grep -q 'spec_husbandryWater' scripts/AutoDriveFlurkarte.lua
          grep -q 'spec_husbandryStraw' scripts/AutoDriveFlurkarte.lua
          grep -q 'spec_husbandryMeadow' scripts/AutoDriveFlurkarte.lua
          grep -q '<version>4.5.0.0</version>' modDesc.xml

      - name: Validate diff
        run: git diff --check

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/AutoDriveFlurkarte.lua modDesc.xml
          git diff --cached --quiet || git commit -m "feat: export live animal husbandry data"
          git push
