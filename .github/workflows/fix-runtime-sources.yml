name: Fix FS25 runtime data sources

on:
  push:
    paths:
      - '.github/workflows/fix-runtime-sources.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply runtime source fixes
        run: python3 .github/scripts/fix_runtime_sources.py

      - name: Validate Lua syntax
        run: luac -p scripts/AutoDriveFlurkarte.lua

      - name: Verify FS25 vehicle source
        run: grep -q 'vehicleSystem.vehicles' scripts/AutoDriveFlurkarte.lua

      - name: Verify market filter
        run: grep -q 'showOnPriceTable == true' scripts/AutoDriveFlurkarte.lua

      - name: Verify field precedence and version
        run: |
          grep -q 'VERSION         = "4.3.0"' scripts/AutoDriveFlurkarte.lua
          grep -q 'Jede weitere valide, nicht geschnittene Frucht ist eine stehende Kultur' scripts/AutoDriveFlurkarte.lua
          grep -q '<version>4.3.0.0</version>' modDesc.xml

      - name: Validate diff
        run: git diff --check

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/AutoDriveFlurkarte.lua modDesc.xml
          git diff --cached --quiet || git commit -m "fix: use canonical FS25 runtime data sources"
          git push
