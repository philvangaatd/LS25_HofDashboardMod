name: Complete v5 internal rename

on:
  push:
    paths:
      - '.github/workflows/rename-v5-internal.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Apply internal rename
        run: python3 .github/scripts/rename_v5_internal.py

      - name: Validate Lua syntax
        run: |
          luac -p scripts/HofDashboard.lua
          luac -p scripts/PlaceableRegistryAdapter.lua

      - name: Verify v5 identity contract
        run: |
          grep -q 'HofDashboardLive.VERSION         = "5.0.0"' scripts/HofDashboard.lua
          grep -q 'HofDashboardLive.SETTINGS_DIR    = "LS25HofDashboard"' scripts/HofDashboard.lua
          grep -q 'addModEventListener(HofDashboardLive)' scripts/HofDashboard.lua
          grep -q '<version>5.0.0.0</version>' modDesc.xml
          grep -q 'scripts/HofDashboard.lua' modDesc.xml
          ! grep -R -n -E 'AutoDriveFlurkarteLive|FS25_AutoDriveFlurkarte|modSettings/AutoDriveFlurkarte' scripts modDesc.xml README.md
          test ! -e scripts/HofDashboardIdentity.lua

      - name: Validate diff
        run: git diff --check

      - name: Commit v5 internal rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/HofDashboard.lua scripts/HofDashboardIdentity.lua scripts/PlaceableRegistryAdapter.lua modDesc.xml README.md
          git diff --cached --quiet || git commit -m "refactor: complete v5 HofDashboard class rename"
          git push

      - name: Remove one-time migration helpers
        run: |
          git rm -f .github/scripts/rename_v5_internal.py .github/workflows/rename-v5-internal.yml
          git commit -m "chore: remove v5 rename migration helpers"
          git push
